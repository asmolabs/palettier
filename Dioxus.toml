[application]
name = "palettier"
default_platform = "desktop"

[web.app]
title = "Palettier — Assistant de peinture à l'huile"

[bundle]
identifier = "be.asmolabs.palettier"
publisher = "Asmolabs"
icon = ["../packaging/palettier.icns"]
copyright = "Copyright © 2026 Asmolabs"
category = "Graphics and Design"
